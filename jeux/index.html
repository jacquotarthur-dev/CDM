<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Jeux — CDM</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600&display=swap');
 
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { color-scheme: dark; }
 
    body {
      background: #000;
      min-height: 100dvh;
      font-family: 'Barlow Condensed', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
 
    /* ── Bandeau ── */
    .bandeau {
      width: 100%;
      /* Format recommandé pour ton image : 1080 x 400px */
      aspect-ratio: 1080 / 400;
      overflow: hidden;
      position: relative;
      background: #111;
    }
 
    .bandeau img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
 
    /* Placeholder si pas d'image */
    .bandeau-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #222;
    }
 
    /* Dégradé bas du bandeau */
    .bandeau::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 40%;
      background: linear-gradient(to bottom, transparent, #000);
    }
 
    /* ── Grille ── */
    .grid-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px 80px;
      width: 100%;
    }
 
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 100px);
      gap: 32px 40px;
      justify-content: center;
    }
 
    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
 
    .icon-wrap {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 22px;
    }
 
    .icon-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      display: block;
      object-fit: cover;
    }
 
    .app-name {
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-align: center;
      max-width: 100px;
      line-height: 1.1;
    }
 
    .cell.wip .icon-wrap {
      background: #1a1a1a;
      border-radius: 22px;
    }
 
    .cell.wip .wip-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #2a2a2a;
      text-transform: lowercase;
      letter-spacing: 1px;
    }
 
    .cell.wip .app-name { color: transparent; }
 
    /* ── Bouton retour ── */
    .back-btn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: none;
      border: none;
      color: rgba(255,255,255,.15);
      cursor: pointer;
      z-index: 50;
      text-decoration: none;
      display: flex;
    }
  </style>
</head>
<body>
 
  <!-- Bandeau — remplace bandeau.jpg par ton image (format recommandé : 1080x400px) -->
  <div class="bandeau">
    <img src="./bandeau.webp" alt="Jeux"
      onerror="this.style.display='none';this.parentElement.querySelector('.bandeau-placeholder').style.display='flex'" />
    <div class="bandeau-placeholder" style="display:none;">Jeux</div>
  </div>
 
  <div class="grid-wrap">
    <div class="grid">
 
      <!-- Le Dé -->
      <a class="cell" href="../projet3/">
        <div class="icon-wrap">
          <img src="../Icon Dé.webp" alt="Le Dé" />
        </div>
        <span class="app-name">Le Dé</span>
      </a>
 
      <!-- Sondages -->
      <a class="cell" href="../projet6/">
        <div class="icon-wrap">
          <img src="../questionnaires.webp" alt="Sondages" />
        </div>
        <span class="app-name">Sondages</span>
      </a>
 
      <!-- Tu préfères ? — WIP pour l'instant -->
  <a class="cell" href="../projet7/">
        <div class="icon-wrap">
          <img src="../tupreferes.webp" alt="Tu Préfères ?" />
        </div>
        <span class="app-name">Tu Préfères ?</span>
      </a>
 
      <!-- Slot libre -->
      <div class="cell wip">
        <div class="icon-wrap">
          <span class="wip-label">à suivre</span>
        </div>
        <span class="app-name">—</span>
      </div>
 
    </div>
  </div>
 
  <a class="back-btn" href="../">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
  </a>
 
  <script>
    // Redirige vers le hub si pas connecté
    const code = localStorage.getItem('cdm_user_code');
    if (!code) window.location.href = '../';
  </script>
 
</body>
</html>
