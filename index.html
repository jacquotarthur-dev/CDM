<!DOCTYPE html>
<html lang="fr">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  
  <title>CDM</title> 

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="Icon App.png">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root { color-scheme: dark; 
          }

    body {
      background: #000000;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      padding: 40px 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 100px);
      gap: 32px 40px;
      justify-content: center;
      z-index: 1;
    }

    /* — Cellule commune — */
    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

     /* — Wrapper icône (pour le liseret) — */
    .icon-wrap {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 22px;
      overflow: visible; /* le canvas SVG sort légèrement */
    }



    /* Icône image */
    .icon-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      display: block;
      object-fit: cover;
    }

    /* Nom sous l'icône */
    .cell .app-name {
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-align: center;
      max-width: 100px;
      line-height: 1.1;
    }

    /* — Cases WIP — */
    .cell.wip .icon-wrap {
      background: #222;
      border-radius: 22px;
    }

    .cell.wip .wip-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1px;
      color: #3a3a3a;
      text-transform: lowercase;
    }

    .cell.wip .app-name { color: transparent; }


  </style>
  
 




  
</head>
<body>

<!-- Compteur -->
<div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:48px;position:relative;z-index:1;">
  <p style="font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#555;">Paul nous doit :</p>
  <p id="counter-display" style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:500;letter-spacing:3px;color:#fff;">00j : 00h : 00m : 00s</p>
<div id="add-time-wrap" style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:4px;">
  
  <!-- Bouton pour ouvrir l'éditeur -->
  <button id="counter-btn" onclick="toggleEditor()"
    style="background:none;border:1px solid #222;border-radius:20px;color:#444;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:8px 20px;cursor:pointer;">
    Encore...
  </button>

  <!-- Éditeur (caché par défaut) -->
  <div id="time-editor" style="display:none;flex-direction:column;align-items:center;gap:10px;">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        <input id="input-min" type="number" min="0" max="30" value="0"
          style="width:60px;background:none;border:none;border-bottom:1px solid #333;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:28px;text-align:center;outline:none;" />
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;color:#444;">MIN</span>
      </div>
      <span style="color:#333;font-size:28px;font-family:'Barlow Condensed',sans-serif;">:</span>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        <input id="input-sec" type="number" min="0" max="59" value="0"
          style="width:60px;background:none;border:none;border-bottom:1px solid #333;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:28px;text-align:center;outline:none;" />
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;color:#444;">SEC</span>
      </div>
    </div>
    <button onclick="addTime()"
      style="background:none;border:1px solid #333;border-radius:20px;color:#888;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:8px 24px;cursor:pointer;">
      Confirmer
    </button>
    <p id="add-err" style="font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;color:#e05c5c;opacity:0;">Max 30 minutes</p>
  </div>

</div>
</div>
  
  
  <div class="grid">

    <!-- Projet 1 -->
    <a class="cell p1" href="./projet1/">
      <div class="icon-wrap">
        <img src="./Icon Booster.png" alt="Booster" />
        
          <rect class="ring-track" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
          <rect class="ring-light" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
        </svg>
      </div>
      <span class="app-name">Booster CDM</span>
    </a>

    <!-- Projet 2 -->
    <a class="cell p2" href="./projet2/">
      <div class="icon-wrap">
        <img src="./Icon Bangers.webp" alt="Bangers" />
       
          <rect class="ring-track" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
          <rect class="ring-light" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
        </svg>
      </div>
      <span class="app-name">Bangers</span>
    </a>

    <!-- Projet 3 -->
    <a class="cell p3" href="./projet3/">
      <div class="icon-wrap">
        <img src="./Icon Dé.webp" alt="Dé" />
       
          <rect class="ring-track" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
          <rect class="ring-light" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
        </svg>
      </div>
      <span class="app-name">Le Dé</span>
    </a>

    <!-- Projet 4 -->
    <a class="cell p4" href="./projet4/">
      <div class="icon-wrap">
        <img src="./Icon Onboakoa.webp" alt="Onboakoa" />
       
          <rect class="ring-track" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
          <rect class="ring-light" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
        </svg>
      </div>
      <span class="app-name">Onboakoa</span>
    </a>

   <!-- Projet 5 -->
    <a class="cell p5" href="./projet5/">
      <div class="icon-wrap">
        <img src="./Icon Idées.webp" alt="Blog" />
      
          <rect class="ring-track" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
          <rect class="ring-light" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
        </svg>
      </div>
      <span class="app-name">Idées du Malaise</span>
    </a>

    <!-- WIP 6 -->
    <div class="cell wip">
      <div class="icon-wrap">
        <span class="wip-label">à suivre</span>
      </div>
      <span class="app-name">—</span>
    </div>

  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, runTransaction, setDoc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCgP0hd88OZc_WWGsS0kAUBOumAXeos07I",
    authDomain: "blog-cdm.firebaseapp.com",
    projectId: "blog-cdm",
    storageBucket: "blog-cdm.firebasestorage.app",
    messagingSenderId: "727621219684",
    appId: "1:727621219684:web:a4717bf808b7ea8fb8b671"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
  const counterRef = doc(db, 'hub', 'counter');

  // ── Affichage ──
  function displaySeconds(s) {
    const j   = Math.floor(s / 86400);
    const h   = Math.floor((s % 86400) / 3600);
    const m   = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    document.getElementById('counter-display').textContent =
      `${String(j).padStart(2,'0')}j : ${String(h).padStart(2,'0')}h : ${String(m).padStart(2,'0')}m : ${String(sec).padStart(2,'0')}s`;
  }

  // ── Écoute Firestore en temps réel ──
  onSnapshot(counterRef, snap => {
    if (snap.exists()) {
      displaySeconds(snap.data().totalSeconds || 0);
    } else {
      setDoc(counterRef, { totalSeconds: 0 });
      displaySeconds(0);
    }
  });

  // ── Ouvre / ferme l'éditeur ──
  window.toggleEditor = function() {
    const editor = document.getElementById('time-editor');
    const btn    = document.getElementById('counter-btn');
    const open   = editor.style.display === 'none';
    editor.style.display = open ? 'flex' : 'none';
    btn.textContent = open ? 'Annuler' : 'Ajouter du temps';
    btn.style.color = open ? '#888' : '#444';
    document.getElementById('input-min').value = '0';
    document.getElementById('input-sec').value = '0';
    document.getElementById('add-err').style.opacity = '0';
  };

  // ── Ajouter du temps ──
  window.addTime = async function() {
    const min = parseInt(document.getElementById('input-min').value) || 0;
    const sec = parseInt(document.getElementById('input-sec').value) || 0;
    const toAdd = (min * 60) + sec;
    const err = document.getElementById('add-err');

    // Validation
    if (toAdd <= 0) return;
    if (toAdd > 1800) { // 30 mins max
      err.style.opacity = '1';
      return;
    }

    err.style.opacity = '0';

    await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(counterRef);
      const current = snap.exists() ? snap.data().totalSeconds || 0 : 0;
      transaction.set(counterRef, { totalSeconds: current + toAdd });
    });

    // Ferme l'éditeur après confirmation
    toggleEditor();
  };
</script>
  
</body>
</html>

</html>
