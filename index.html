<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDM — Hub</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080808;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', monospace;
      padding: 32px 24px;
    }

    .label {
      color: #333;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 380px;
    }

    .card {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 4px;
      text-decoration: none;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease;
    }

    .card:active { transform: scale(0.96); }

    .card.active {
      background: #111;
      border: 1px solid #222;
    }

    .card.active .icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card.active .icon svg {
      width: 48%;
      height: 48%;
      opacity: 0.9;
    }

    .card.active .name {
      position: absolute;
      bottom: 14px;
      left: 0; right: 0;
      text-align: center;
      font-size: 10px;
      letter-spacing: 2px;
      color: #666;
      text-transform: uppercase;
    }

    .card.active::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.04) 0%, transparent 70%);
    }

    .card.wip {
      background: transparent;
      border: 1.5px dashed #222;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    .card.wip .wip-label {
      font-size: 9px;
      letter-spacing: 2px;
      color: #2a2a2a;
      text-transform: uppercase;
    }

    .p1 .icon svg { color: #C8A97E; }
    .p2 .icon svg { color: #7EA8C8; }
    .p3 .icon svg { color: #A8C87E; }
  </style>
</head>
<body>

  <p class="label">CDM</p>

  <div class="grid">

    <a class="card active p1" href="./projet1/">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 10l4.553-2.276A1 1 0 0121 8.723v6.554a1 1 0 01-1.447.894L15 14"/>
          <rect x="3" y="8" width="12" height="8" rx="2"/>
        </svg>
      </div>
      <span class="name">Projet 1</span>
    </a>

    <a class="card active p2" href="./projet2/">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <circle cx="12" cy="12" r="3"/>
          <path d="M8.5 5.5V5M15.5 5.5V5"/>
        </svg>
      </div>
      <span class="name">Projet 2</span>
    </a>

    <a class="card active p3" href="./projet3/">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <span class="name">Projet 3</span>
    </a>

    <a class="card wip" href="./projet4/">
      <span class="wip-label">En cours</span>
    </a>

    <a class="card wip" href="./projet5/">
      <span class="wip-label">En cours</span>
    </a>

    <a class="card wip" href="./projet6/">
      <span class="wip-label">En cours</span>
    </a>

  </div>

</body>
</html>
