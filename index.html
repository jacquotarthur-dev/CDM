  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root { color-scheme: dark; 
          }

    body {
      background: #000000;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      padding: 40px 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 100px);
      gap: 32px 40px;
      justify-content: center;
      z-index: 1;
    }

    /* — Cellule commune — */
    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

     /* — Wrapper icône (pour le liseret) — */
    .icon-wrap {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 22px;
      overflow: visible; /* le canvas SVG sort légèrement */
    }



    /* Icône image */
    .icon-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      display: block;
      object-fit: cover;
    }

    /* Nom sous l'icône */
    .cell .app-name {
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-align: center;
      max-width: 100px;
      line-height: 1.1;
    }

    /* — Cases WIP — */
    .cell.wip .icon-wrap {
      background: #222;
      border-radius: 22px;
    }

    .cell.wip .wip-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1px;
      color: #3a3a3a;
      text-transform: lowercase;
    }

    .cell.wip .app-name { color: transparent; }

     /* — Liseret SVG — */
    .glow-ring {
      position: absolute;
      inset: -3px;
      width: calc(100% + 6px);
      height: calc(100% + 6px);
      pointer-events: none;
      border-radius: 25px;
      overflow: visible;
    }

    .ring-track {
      fill: none;
      stroke: rgba(255,255,255,0.08);
      stroke-width: 2;
    }

    .ring-light {
      fill: none;
      stroke: rgba(255,255,255,0.85);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 30 300;
      stroke-dashoffset: 0;
      filter: drop-shadow(0 0 4px rgba(255,255,255,0.9));
    }
   /* Animation générique */
    @keyframes sweep {
      0%   { stroke-dashoffset: 0; opacity: 1; }
      80%  { stroke-dashoffset: -330; opacity: 1; }
      90%  { stroke-dashoffset: -330; opacity: 0; }
      100% { stroke-dashoffset: -330; opacity: 0; }
    }

    .p1 .ring-light {
      animation: sweep 1s cubic-bezier(0.4,0,0.2,1) infinite;
      animation-play-state: paused;
    }
    .p2 .ring-light {
      animation: sweep 1s cubic-bezier(0.4,0,0.2,1) infinite;
      animation-play-state: paused;
    }
    .p3 .ring-light {
      animation: sweep 1s cubic-bezier(0.4,0,0.2,1) infinite;
      animation-play-state: paused;
    }

    .ring-light.running {
      animation-play-state: running !important;
    }
  </style>
  
 




  
</head>

<script>

 
    // Décalages en ms pour chaque icône active
    const delays = { p1: 0, p2: 3000, p3: 6000 };
    const interval = 10000; // toutes les 10s

    function triggerRing(selector, delay) {
      setTimeout(function fire() {
        const ring = document.querySelector('.' + selector + ' .ring-light');
        if (!ring) return;
        ring.classList.remove('running');
        void ring.offsetWidth; // reflow pour reset
        ring.classList.add('running');

        // Retire la classe après 1s (durée de l'anim) pour permettre le reset au prochain cycle
        setTimeout(() => ring.classList.remove('running'), 1000);

        setTimeout(fire, interval);
      }, delay);
    }

    triggerRing('p1', delays.p1);
    triggerRing('p2', delays.p2);
    triggerRing('p3', delays.p3);
  </script>

 
  
  
<style>
  #lock-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 99999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  #lock-screen.visible { display: flex; }
</style>

<div id="lock-screen">
  <p style="color:#333;font-size:10px;letter-spacing:4px;text-transform:uppercase;font-family:monospace">Code d'accès</p>
  <input id="code-input" type="password" maxlength="20"
    style="background:none;border:none;border-bottom:1px solid #222;color:#fff;font-family:monospace;font-size:18px;text-align:center;outline:none;width:120px;padding:8px 0;letter-spacing:8px"
    placeholder="····" />
  <button onclick="checkCode()"
    style="background:none;border:1px solid #222;color:#555;font-family:monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;padding:10px 24px;cursor:pointer;margin-top:8px">
    Valider
  </button>
  <p id="err" style="color:#ff4444;font-size:10px;letter-spacing:2px;font-family:monospace;opacity:0">Code incorrect</p>
</div>

<script>
  const CODE = "121016";

  const lock = document.getElementById('lock-screen');
  const input = document.getElementById('code-input');

  if (localStorage.getItem('cdm_access') !== CODE) {
    lock.classList.add('visible');
    document.body.style.overflow = 'hidden';
  }

  function checkCode() {
    if (input.value === CODE) {
      localStorage.setItem('cdm_access', CODE);
      lock.classList.remove('visible');
      document.body.style.overflow = '';
    } else {
      document.getElementById('err').style.opacity = '1';
      input.value = '';
      input.focus();
    }
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') checkCode();
  });
</script>
