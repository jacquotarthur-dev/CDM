<!DOCTYPE html>
<html lang="fr">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  
  <title>CDM</title> 

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="Icon App.png">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root { color-scheme: dark; 
          }

    body {
      background: #000000;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      padding: 40px 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 100px);
      gap: 32px 40px;
      justify-content: center;
      z-index: 1;
    }

    /* — Cellule commune — */
    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

     /* — Wrapper icône (pour le liseret) — */
    .icon-wrap {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 22px;
      overflow: visible; /* le canvas SVG sort légèrement */
    }



    /* Icône image */
    .icon-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      display: block;
      object-fit: cover;
    }

    /* Nom sous l'icône */
    .cell .app-name {
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-align: center;
      max-width: 100px;
      line-height: 1.1;
    }

    /* — Cases WIP — */
    .cell.wip .icon-wrap {
      background: #222;
      border-radius: 22px;
    }

    .cell.wip .wip-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1px;
      color: #3a3a3a;
      text-transform: lowercase;
    }

    .cell.wip .app-name { color: transparent; }


  </style>
  
 




  
</head>
<body>

<!-- Compteur -->
<div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:48px;position:relative;z-index:1;">
  <p style="font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#555;">Paul nous doit :</p>
  <p id="counter-display" style="font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:500;letter-spacing:4px;color:#fff;">00j : 00h : 00m : 00s</p>
  <button id="counter-btn" onclick="toggleCounter()"
    style="margin-top:4px;background:none;border:1px solid #222;border-radius:20px;color:#444;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:8px 20px;cursor:pointer;">
    Je l'attends
  </button>
</div>
  
  
  <div class="grid">

    <!-- Projet 1 -->
    <a class="cell p1" href="./projet1/">
      <div class="icon-wrap">
        <img src="./Icon Booster.png" alt="Booster" />
        
          <rect class="ring-track" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
          <rect class="ring-light" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
        </svg>
      </div>
      <span class="app-name">Booster CDM</span>
    </a>

    <!-- Projet 2 -->
    <a class="cell p2" href="./projet2/">
      <div class="icon-wrap">
        <img src="./Icon Bangers.webp" alt="Bangers" />
       
          <rect class="ring-track" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
          <rect class="ring-light" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
        </svg>
      </div>
      <span class="app-name">Bangers</span>
    </a>

    <!-- Projet 3 -->
    <a class="cell p3" href="./projet3/">
      <div class="icon-wrap">
        <img src="./Icon Dé.webp" alt="Dé" />
       
          <rect class="ring-track" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
          <rect class="ring-light" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
        </svg>
      </div>
      <span class="app-name">Le Dé</span>
    </a>

    <!-- Projet 4 -->
    <a class="cell p4" href="./projet4/">
      <div class="icon-wrap">
        <img src="./Icon Onboakoa.webp" alt="Onboakoa" />
       
          <rect class="ring-track" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
          <rect class="ring-light" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
        </svg>
      </div>
      <span class="app-name">Onboakoa</span>
    </a>

   <!-- Projet 5 -->
    <a class="cell p5" href="./projet5/">
      <div class="icon-wrap">
        <img src="./Icon Idées.webp" alt="Blog" />
      
          <rect class="ring-track" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
          <rect class="ring-light" x="1" y="1" width="104" height="104" rx="24" ry="24"/>
        </svg>
      </div>
      <span class="app-name">Idées du Malaise</span>
    </a>

    <!-- WIP 6 -->
    <div class="cell wip">
      <div class="icon-wrap">
        <span class="wip-label">à suivre</span>
      </div>
      <span class="app-name">—</span>
    </div>

  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, runTransaction, serverTimestamp, increment }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getDatabase, ref, onDisconnect, set, remove, onValue }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCgP0hd88OZc_WWGsS0kAUBOumAXeos07I",
    authDomain: "blog-cdm.firebaseapp.com",
    projectId: "blog-cdm",
    storageBucket: "blog-cdm.firebasestorage.app",
    messagingSenderId: "727621219684",
    appId: "1:727621219684:web:a4717bf808b7ea8fb8b671",
    databaseURL: "https://blog-cdm-default-rtdb.europe-west1.firebaseio.com"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
  const rtdb = getDatabase(app);

  // Référence du document compteur dans Firestore
  const counterRef = doc(db, 'hub', 'counter');

  // Clé unique pour ce visiteur dans Realtime DB
  const visitorId = Math.random().toString(36).slice(2);
  const presenceRef = ref(rtdb, `activeUsers/${visitorId}`);

  let isActive = false;
  let localInterval = null;
  let totalSeconds = 0;
  let activeCount = 0;

  // ── Affichage ──
  function displaySeconds(s) {
    const j = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    document.getElementById('counter-display').textContent =
      `${String(j).padStart(2,'0')}j : ${String(h).padStart(2,'0')}h : ${String(m).padStart(2,'0')}m : ${String(sec).padStart(2,'0')}s`;
  }

  // ── Écoute Firestore (totalSeconds) ──
  onSnapshot(counterRef, snap => {
    if (snap.exists()) {
      totalSeconds = snap.data().totalSeconds || 0;
      displaySeconds(totalSeconds);
    }
  });

  // ── Écoute Realtime DB (activeUsers) ──
  onValue(ref(rtdb, 'activeUsers'), snap => {
    activeCount = snap.exists() ? Object.keys(snap.val()).length : 0;
  });

  // ── Tick local (toutes les secondes) ──
  function startTick() {
    localInterval = setInterval(async () => {
      const add = Math.max(1, activeCount);
      totalSeconds += add;
      displaySeconds(totalSeconds);
      // Sauvegarde dans Firestore
      await runTransaction(counterRef, current => {
        const data = current.data() || { totalSeconds: 0 };
        return { totalSeconds: Math.max(data.totalSeconds, totalSeconds) };
      });
    }, 1000);
  }

  function stopTick() {
    clearInterval(localInterval);
    localInterval = null;
  }

  // ── Bouton ──
  window.toggleCounter = async function() {
    const btn = document.getElementById('counter-btn');
    if (!isActive) {
      isActive = true;
      btn.textContent = 'Il est là !';
      btn.style.color = '#fff';
      btn.style.borderColor = '#444';
      // Enregistre la présence, auto-supprimée à la déconnexion
      await set(presenceRef, true);
      onDisconnect(presenceRef).remove();
      startTick();
    } else {
      isActive = false;
      btn.textContent = 'Je l\'attends';
      btn.style.color = '#444';
      btn.style.borderColor = '#222';
      await remove(presenceRef);
      stopTick();
    }
  };
</script>
  
</body>
</html>
