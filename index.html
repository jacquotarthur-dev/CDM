<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDM — Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px 20px;
    }

    .label {
      color: #555;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      max-width: 400px;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 140px;
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      transition: transform 0.12s ease, opacity 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .card:active {
      transform: scale(0.95);
      opacity: 0.85;
    }

    .p1 { background: #E24B4A; }
    .p2 { background: #378ADD; }
    .p3 { background: #1D9E75; }
    .p4 { background: #EF9F27; }
    .p5 { background: #7F77DD; }
    .p6 { background: #D4537E; }
  </style>
</head>
<body>
  <p class="label">CDM</p>
  <div class="grid">
    <a class="card p1" href="./projet1/">Projet 1</a>
    <a class="card p2" href="./projet2/">Projet 2</a>
    <a class="card p3" href="./projet3/">Projet 3</a>
    <a class="card p4" href="./projet4/">Projet 4</a>
    <a class="card p5" href="./projet5/">Projet 5</a>
    <a class="card p6" href="./projet6/">Projet 6</a>
  </div>
</body>
</html>
